services:
  mkv-auto-service:
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    tty: true
    environment:
      - UID=1000
      - GID=1000
      # Answers output-path lookups for the qBittorrent live-copy integration
      - RESOLVE_WORKER=${RESOLVE_WORKER:-false}
      - RESOLVE_QUEUE_DIR=${RESOLVE_QUEUE_DIR:-/mkv-auto/files/input/.mkv-auto-resolve}
    volumes:
      - ${INPUT_FOLDER}:/mkv-auto/files/input
      - ${OUTPUT_FOLDER}:/mkv-auto/files/output
      - ${TEMP_FOLDER}:/mkv-auto/files/tmp
      - ${CONFIG_FOLDER}:/mkv-auto/config
      - ${LOGS_FOLDER}:/mkv-auto/logs
    entrypoint: ["/bin/bash", "/mkv-auto/service-entrypoint.sh"]
